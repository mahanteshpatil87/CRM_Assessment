# Base configuration - overridden by qa.properties or -D system properties when needed
baseUrl=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
browser=chrome
headless=false
implicitWaitSeconds=0
# Bumped from 15s: the public OrangeHRM demo is a shared, heavily-trafficked
# sandbox, and elements that depend on an async server round-trip (dropdown
# option lists, autocomplete suggestions, post-save page navigation) were
# observed timing out at 15s under real load while identical mechanisms
# passed reliably elsewhere in the same run - a locator/timing margin issue,
# not a broken locator (see docs/framework-architecture.md known limitations).
explicitTimeoutSeconds=30
pageLoadTimeoutSeconds=30

# Admin demo credentials (publicly shown on the login page itself - not sensitive. I can encode as per project requirements.)
adminUsername=Admin
adminPassword=admin123

# File paths (relative to project root, since Selenium needs real filesystem paths)
validResumeFilePath=test-data/files/upload/valid-resume.txt
invalidResumeFilePath=test-data/files/upload/invalid-resume.jpg
downloadDir=test-data/files/expected-downloads

# Data-driven test source (classpath resource, read via Apache POI)
employeeTestDataFile=testdata/employeeTestData.xlsx

# Pool of real-looking first/last names used wherever a test needs a
# plausible person's name rather than a synthetic "AutoQaEmp"-style prefix
# (see TestDataUtils.randomNamePair) - a spreadsheet so the pool is editable
# without touching Java, same rationale as employeeTestDataFile above.
employeeNamesFile=testdata/employeeNames.xlsx